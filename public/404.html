<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting | Games Unblocked Play</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#00e5ff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8687742238485131" crossorigin="anonymous"></script>
    <link rel="preload" as="script" href="https://live.demand.supply/up.js"><script async data-cfasync="false" type="text/javascript" src="https://live.demand.supply/up.js"></script>
    <script>
      (function () {
        // Smart fallback for GitHub Pages SPA routes
        var path = window.location.pathname;
        if (path.indexOf('/game/') === -1) {
          window.location.replace('/' + window.location.search);
        }
      })();
    </script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        background: #0b0f19;
        color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
      }
      .box {
        max-width: 440px;
        background: #111827;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 40px 28px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      }
      .logo {
        font-size: 1.5rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 20px;
        color: #fff;
      }
      .logo span { color: #00e5ff; }
      .spinner {
        width: 44px;
        height: 44px;
        border: 3px solid rgba(0, 229, 255, 0.15);
        border-top-color: #00e5ff;
        border-radius: 50%;
        margin: 0 auto 20px;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; color: #f8fafc; }
      p { font-size: 0.95rem; color: #94a3b8; line-height: 1.5; margin-bottom: 24px; }
      .btn {
        display: inline-block;
        background: linear-gradient(135deg, #00e5ff, #0284c7);
        color: #04131f;
        font-weight: 700;
        text-decoration: none;
        padding: 12px 24px;
        border-radius: 12px;
        transition: transform 0.2s, box-shadow 0.2s;
      }
      .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,229,255,0.3); }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spinner"></div>
      <div class="logo">🎮 GamesUnblocked<span>PLAY</span></div>
      <h1>Loading Game Portal...</h1>
      <p>Taking you directly to the games catalog. If you are not redirected automatically, click below.</p>
      <a href="/" class="btn">Go to Home</a>
    </div>
  </body>
</html>
